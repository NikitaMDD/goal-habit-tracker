services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      AGENT_URL: http://agent:8000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - agent

  agent:
    build: ./agent
    ports:
      - "${AGENT_PORT:-8000}:8000"
    volumes:
      - ./agent:/app
